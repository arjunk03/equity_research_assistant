[project]
name = "equitty-research-assistant"
version = "0.1.0"
description = "Equity research assistant"
readme = "README.md"
authors = [
    { name = "Arjun K", email = "arjunk03@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
equitty-research-assistant = "equitty_research_assistant:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pre-commit>=4.3",
    "pytest>=8.4",
    "ruff>=0.17.3",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 88

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "N",
    "RUF",
    "SIM",
    "UP",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
pretty = true
show_error_codes = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
